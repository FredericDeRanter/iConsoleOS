apply plugin: 'com.android.application'

android {
    namespace "eu.le_tian.iConsoleOS"
    compileSdk 37
    defaultConfig {
        applicationId "eu.le_tian.iConsoleOS"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes one JSON file per DB version here; commit them, migration tests use them
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // MigrationTestHelper reads the exported schemas (app/schemas) as test assets
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
    testOptions {
        // android.util.Log etc. return defaults instead of throwing in JVM unit tests
        unitTests.returnDefaultValues = true
    }
}

configurations.configureEach {
    exclude group: 'com.android.support'
}

dependencies {
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':boxedverticalseekbar')
    implementation libs.appcompat
    implementation libs.annotation
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.number.picker
    implementation project(':scrollablenumberpicker')
    implementation libs.opencsv
    implementation project(':android_antlib_4-14-0')
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.room.testing
    androidTestImplementation libs.espresso.core
    implementation libs.recyclerview.selection

    constraints {
        // room-testing (MigrationTest) needs kotlinx-serialization 1.8.x; the test APK shares the
        // app's copy, which Navigation would otherwise keep at 1.7.x (AbstractMethodError).
        implementation('org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1')
    }
}
